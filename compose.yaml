services:
  postgres:
    image: 'pgvector/pgvector:pg17'
    labels:
      # Tells Spring Boot's Docker Compose support that this (custom-named) image is PostgreSQL
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leyesapi}
      POSTGRES_USER: ${POSTGRES_USER:-leyesapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leyesapi}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-leyesapi} -d ${POSTGRES_DB:-leyesapi}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside Compose the database host is the service name, not localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-leyesapi}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-leyesapi}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-leyesapi}
      # The app is already running inside Compose; it must not try to start it again.
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
    ports:
      - '8080:8080'

volumes:
  postgres_data:
