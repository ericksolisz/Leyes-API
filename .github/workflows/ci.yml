name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The executable bit can be lost when the repo is created from Windows.
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Tests use Testcontainers; the ubuntu runner already provides Docker.
      - name: Build and test
        run: ./mvnw -B verify
